# Deploy VitaCerta static site and migrate Blogger posts
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Migrate Blogger posts
        run: python3 scripts/migrate_blogger.py
      - name: Sync internal article catalog
        run: python3 scripts/sync_articles_catalog.py
      - name: Link institutional footer pages
        run: python3 scripts/link_footer.py
      - name: Install prerender browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prerender home for SEO
        run: node scripts/prerender_home.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
