<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitaCerta Radar — Publicações</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8f7;color:#26332e}.wrap{max-width:1240px;margin:auto;padding:28px 20px 60px}.brand{font-size:27px;font-weight:800;color:#1f3d32}.brand span{color:#78917f}.muted{color:#718078;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.nav a{color:#26332e;text-decoration:none;border:1px solid #dce3df;background:#fff;border-radius:9px;padding:8px 12px;font-size:13px}.nav .active{background:#1f3d32;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #e1e6e3;border-radius:14px;padding:18px}.kpi{font-size:30px;font-weight:800;color:#1f3d32;margin-top:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.controls select{background:#fff;border:1px solid #dce3df;border-radius:9px;padding:9px 11px;color:#34463d}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e1e6e3}.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0ee;font-size:13px}.table th{background:#f4f7f5;color:#506259}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3ef;color:#45614f;font-size:12px;font-weight:700}.warn{background:#f6f0e5;color:#80662d}.notice{background:#fff8e9;border:1px solid #eee0bd;color:#735e2d;padding:12px 14px;border-radius:10px;margin:12px 0;font-size:13px}.empty{text-align:center;color:#7c8982;padding:25px}.link{color:#1f3d32;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.table{display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="brand">VitaCerta <span>Radar</span></div><div class="muted">Admin • controle de publicações</div><div class="nav"><a href="./">Visão geral</a><a href="./">Performance</a><a href="./">Oportunidades</a><a href="./">Produção</a><a class="active" href="publicacoes.html">Publicações</a><a href="./">Aprendizado</a></div><div class="grid"><div class="card"><div class="muted">Total</div><div class="kpi" id="total">—</div></div><div class="card"><div class="muted">Rascunhos</div><div class="kpi" id="drafts">—</div></div><div class="card"><div class="muted">Aprovadas</div><div class="kpi" id="approved">—</div></div><div class="card"><div class="muted">Publicadas</div><div class="kpi" id="published">—</div></div></div><div class="controls"><select id="status"><option value="">Todos os status</option><option>RASCUNHO</option><option>EM_REVISAO</option><option>APROVADO</option><option>PUBLICADO</option><option>ERRO</option></select><select id="category"><option value="">Todas as categorias</option></select><select id="language"><option value="">Todos os idiomas</option></select></div><div id="notice"></div><table class="table"><thead><tr><th>Título</th><th>Categoria</th><th>Idioma</th><th>Revisão</th><th>Status</th><th>Publicado em</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table></div><script>let PUB=[];async function load(){let r=await fetch('../data/publications.json',{cache:'no-store'}),d=await r.json();PUB=d.publications||[];total.textContent=PUB.length;drafts.textContent=PUB.filter(x=>x.status==='RASCUNHO').length;approved.textContent=PUB.filter(x=>x.status==='APROVADO').length;published.textContent=PUB.filter(x=>x.status==='PUBLICADO').length;fill('category',PUB.map(x=>x.category),'Todas as categorias');fill('language',PUB.map(x=>x.language),'Todos os idiomas');render()}function fill(id,v,l){document.getElementById(id).innerHTML='<option value="">'+l+'</option>'+[...new Set(v.filter(Boolean))].sort().map(x=>`<option>${x}</option>`).join('')}function render(){let s=status.value,c=category.value,l=language.value,a=PUB.filter(x=>(!s||x.status===s)&&(!c||x.category===c)&&(!l||x.language===l));notice.innerHTML=!PUB.length?'<div class="notice">Nenhuma publicação nova registrada ainda. Os artigos atuais vieram do Blogger e permanecem no cadastro de artigos enquanto a migração está pendente.</div>':'';rows.innerHTML=a.map(x=>`<tr><td><strong>${x.title}</strong></td><td>${x.category||'—'}</td><td>${x.language||'—'}</td><td>${x.review_status||'—'}</td><td><span class="status ${x.status==='ERRO'?'warn':''}">${x.status}</span></td><td>${x.published_at?new Date(x.published_at).toLocaleDateString('pt-BR'):'—'}</td><td>${x.public_url?`<a class="link" target="_blank" href="${x.public_url}">Abrir</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma publicação encontrada.</td></tr>'}['status','category','language'].forEach(id=>document.getElementById(id).onchange=render);load().catch(()=>notice.innerHTML='<div class="notice">Erro ao carregar o registro de publicações.</div>');</script></body></html>
