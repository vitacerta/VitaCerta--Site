<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VitaCerta — Motor Editorial</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8f7;color:#26332e}.wrap{max-width:620px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #e1e6e3;border-radius:14px;padding:20px}.brand{font-size:22px;font-weight:800;color:#1f3d32}.brand span{color:#78917f}.muted{color:#718078;font-size:13px;line-height:1.5;margin-top:6px}.status{margin-top:18px;padding:12px 14px;border-radius:10px;background:#eef3ef;color:#45614f;font-size:13px}.error{background:#fff0f0;color:#8b3434}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">VitaCerta <span>Motor Editorial</span></div>
    <div class="muted">Ponte segura entre o Radar de Produção e o backend do Google Apps Script. A geração e a aprovação permanecem no Radar.</div>
    <div id="status" class="status">Inicializando o motor...</div>
  </div>
</div>
<script>
(function(){
  const ALLOWED_PARENT_ORIGIN='https://vitacerta.github.io';
  const statusEl=document.getElementById('status');
  let busy=false;

  function setStatus(text,isError){
    statusEl.textContent=text;
    statusEl.className='status'+(isError?' error':'');
  }

  function send(type,payload){
    if(window.parent===window)return;
    window.parent.postMessage({type:type,payload:payload||{}},ALLOWED_PARENT_ORIGIN);
  }

  function generate(payload){
    if(busy){
      send('VITACERTA_GENERATE_RESULT',{ok:false,error:'Já existe uma geração em andamento.'});
      return;
    }
    busy=true;
    setStatus('Gerando conteúdo...');
    google.script.run
      .withSuccessHandler(function(res){
        busy=false;
        if(res&&res.ok){
          setStatus('Rascunho gerado. Volte ao Radar para revisar.');
        }else{
          setStatus((res&&res.error)||'Falha na geração.',true);
        }
        send('VITACERTA_GENERATE_RESULT',res||{ok:false,error:'Resposta vazia do backend.'});
      })
      .withFailureHandler(function(err){
        busy=false;
        const message=err&&err.message?err.message:String(err||'Falha inesperada.');
        setStatus(message,true);
        send('VITACERTA_GENERATE_RESULT',{ok:false,error:message});
      })
      .generateArticle(payload||{});
  }

  window.addEventListener('message',function(event){
    if(event.origin!==ALLOWED_PARENT_ORIGIN)return;
    const data=event.data||{};
    if(data.type==='VITACERTA_GENERATE')generate(data.payload||{});
    if(data.type==='VITACERTA_HEALTH'){
      google.script.run
        .withSuccessHandler(function(res){send('VITACERTA_HEALTH_RESULT',res||{});})
        .withFailureHandler(function(err){send('VITACERTA_HEALTH_RESULT',{ok:false,error:err&&err.message?err.message:String(err)});})
        .healthCheck();
    }
  });

  setStatus('Motor pronto para conexão com o Radar.');
  send('VITACERTA_BRIDGE_READY',{ok:true});
})();
</script>
</body>
</html>
